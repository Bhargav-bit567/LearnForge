name: Repository Guardian

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * 0" # Every Sunday at 10:00 PM IST

permissions:
  contents: read
  issues: write

jobs:
  guardian:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository
        id: scan
        shell: bash
        run: |
          set +e

          REPORT="guardian-report.md"
          FOUND=0

          echo "# 🛡️ Repository Guardian Report" > "$REPORT"
          echo "" >> "$REPORT"
          echo "**Repository:** $GITHUB_REPOSITORY" >> "$REPORT"
          echo "**Commit:** $GITHUB_SHA" >> "$REPORT"
          echo "" >> "$REPORT"

          # -----------------------------------------
          # 1. Check for suspicious secret patterns
          # -----------------------------------------

          echo "## 🔐 Secret Scan" >> "$REPORT"
          echo "" >> "$REPORT"

          SECRET_RESULTS=$(git grep -n -I -E \
            '([A-Za-z0-9_]*(API_KEY|SECRET_KEY|ACCESS_KEY|TOKEN|PASSWORD)[A-Za-z0-9_]*[[:space:]]*=[[:space:]]*["'\''][^"'\'']{8,}["'\''])|(sk-[A-Za-z0-9_-]{20,})|(ghp_[A-Za-z0-9]{20,})|(github_pat_[A-Za-z0-9_]{20,})|(AKIA[0-9A-Z]{16})' \
            -- . \
            ':!.git/*' \
            ':!*.lock' \
            ':!package-lock.json' \
            ':!guardian-report.md' 2>/dev/null)

          if [ -n "$SECRET_RESULTS" ]; then
            echo "⚠️ Possible secret patterns found:" >> "$REPORT"
            echo '```text' >> "$REPORT"
            echo "$SECRET_RESULTS" | cut -d: -f1-2 >> "$REPORT"
            echo '```' >> "$REPORT"
            echo "" >> "$REPORT"
            FOUND=1
          else
            echo "✅ No obvious secret patterns found." >> "$REPORT"
            echo "" >> "$REPORT"
          fi

          # -----------------------------------------
          # 2. Check files larger than 10 MB
          # -----------------------------------------

          echo "## 📦 Large Files" >> "$REPORT"
          echo "" >> "$REPORT"

          LARGE_FILES=$(git ls-files -z | while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file" 2>/dev/null)
              if [ "$size" -gt 10485760 ]; then
                echo "$file ($((size / 1048576)) MB)"
              fi
            fi
          done)

          if [ -n "$LARGE_FILES" ]; then
            echo "⚠️ Files larger than 10 MB:" >> "$REPORT"
            echo '```text' >> "$REPORT"
            echo "$LARGE_FILES" >> "$REPORT"
            echo '```' >> "$REPORT"
            echo "" >> "$REPORT"
            FOUND=1
          else
            echo "✅ No tracked files larger than 10 MB." >> "$REPORT"
            echo "" >> "$REPORT"
          fi

          # -----------------------------------------
          # 3. Find TODO / FIXME
          # -----------------------------------------

          echo "## 📝 TODO / FIXME" >> "$REPORT"
          echo "" >> "$REPORT"

          TODO_RESULTS=$(git grep -n -I -E 'TODO|FIXME' -- . \
            ':!.git/*' \
            ':!guardian-report.md' 2>/dev/null)

          if [ -n "$TODO_RESULTS" ]; then
            COUNT=$(echo "$TODO_RESULTS" | wc -l)

            echo "Found **$COUNT** TODO/FIXME items:" >> "$REPORT"
            echo '```text' >> "$REPORT"
            echo "$TODO_RESULTS" | head -50 >> "$REPORT"
            echo '```' >> "$REPORT"
          else
            echo "✅ No TODO/FIXME items found." >> "$REPORT"
          fi

          echo "" >> "$REPORT"

          # -----------------------------------------
          # 4. Repository summary
          # -----------------------------------------

          echo "## 📊 Repository Statistics" >> "$REPORT"
          echo "" >> "$REPORT"

          FILE_COUNT=$(git ls-files | wc -l)
          COMMIT_COUNT=$(git rev-list --count HEAD)

          echo "- Tracked files: **$FILE_COUNT**" >> "$REPORT"
          echo "- Commits: **$COMMIT_COUNT**" >> "$REPORT"

          echo "" >> "$REPORT"
          echo "---" >> "$REPORT"

          if [ "$FOUND" -eq 1 ]; then
            echo "Problems were detected."
          else
            echo "No critical problems detected."
          fi

          echo "FOUND=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Upload Guardian Report
        uses: actions/upload-artifact@v4
        with:
          name: repository-guardian-report
          path: guardian-report.md

      - name: Create GitHub Issue
        if: steps.scan.outputs.FOUND == '1' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🛡️ Repository Guardian detected problems" \
            --body-file guardian-report.md \
            --label "security"
